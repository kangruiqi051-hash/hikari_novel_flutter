name: Build and Release APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout latest source
        uses: actions/checkout@v6

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.4"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        shell: bash
        run: |
          BUILD_NUMBER=$((10000 + GITHUB_RUN_NUMBER))
          flutter build apk --release --build-number "$BUILD_NUMBER"

      - name: Prepare APK
        shell: bash
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          APK_NAME="hikari-novel-${GITHUB_REF_NAME}-${SHORT_SHA}.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "$APK_NAME"
          echo "APK_NAME=$APK_NAME" >> "$GITHUB_ENV"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: hikari-novel-${{ github.ref_name }}-${{ github.run_number }}
          path: ${{ env.APK_NAME }}
          if-no-files-found: error
          retention-days: 30

      - name: Create prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="auto-${GITHUB_REF_NAME}-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" "$APK_NAME" \
            --target "$GITHUB_SHA" \
            --title "Automatic build ${GITHUB_REF_NAME} #${GITHUB_RUN_NUMBER}" \
            --notes "Automatically built from the latest source on ${GITHUB_REF_NAME}. Commit: ${GITHUB_SHA}" \
            --prerelease
